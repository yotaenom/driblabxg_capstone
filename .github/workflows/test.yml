name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8, 3.9, "3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test data loading
      run: |
        python -c "from src.data_loader import load_all_data; print('Data loader test passed')"
    
    - name: Test data validation
      run: |
        python -c "from src.data_validation import validate_all_data; print('Data validation test passed')"
    
    - name: Test data preprocessing
      run: |
        python -c "from src.data_preprocessing import preprocess_all_data; print('Data preprocessing test passed')"
    
    - name: Test inference
      run: |
        python -c "from src.inference import run_inference_pipeline; print('Inference test passed')"
    
    - name: Test logger
      run: |
        python -c "from src.logger import setup_logger; logger = setup_logger(); logger.info('Logger test passed')"
    
    - name: Test model registry
      run: |
        python -c "from src.model_registry import ModelRegistry; registry = ModelRegistry(); print('Model registry test passed')" 